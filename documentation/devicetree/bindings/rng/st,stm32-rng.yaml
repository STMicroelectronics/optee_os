%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/st,stm32-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32 RNG

description: |
  The STM32 hardware random number generator is a simple fixed purpose
  IP and is fully separated from other crypto functions.

maintainers:
  - Lionel Debieve <lionel.debieve@foss.st.com>

properties:
  compatible:
    enum:
      - st,stm32-rng
      - st,stm32mp13-rng
      - st,stm32mp21-rng
      - st,stm32mp25-rng

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    items:
      - const: core
      - const: bus

  resets:
    maxItems: 1

  clock-error-detect:
    type: boolean
    description: If set enable the clock detection management

  access-controllers:
    minItems: 1
    maxItems: 2

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - st,stm32mp13-rng
              - st,stm32mp25-rng
    then:
      properties:
        st,rng-lock-conf:
          type: boolean
          description: If set, the RNG configuration in RNG_CR, RNG_HTCR and
                       RNG_NSCR will be locked.

  - if:
      properties:
        compatible:
          contains:
            enum:
              - st,stm32-rng
              - st,stm32mp13-rng
    then:
      properties:
        clocks:
          maxItems: 1
        clock-names: false
    else:
      properties:
        clocks:
          minItems: 2

        clock-names:
          items:
            - const: rng_clk  # RNG kernel clock
            - const: rng_hclk # RNG bus clock

      required:
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            enum:
              - st,stm32mp13-rng
              - st,stm32mp21-rng
              - st,stm32mp25-rng
    then:
      properties:
        st,rng-cfg:
          minItems: 1
          maxItems: 3
          type: boolean
          description: The configuration bitfields to initialize the RNG. They
                       must be listed in the numerical order. If not specified,
                       the default hard-coded values will be used. Number of
                       values depends on the presence of
                       st,rng-nist-custom property.

        st,rng-cfg-nist-custom:
          type: boolean
          description: Enable custom values for NIST compliant RNG.

        st,rng-htcfg:
          maxItems: 1
          description: The values to configure health tests. If not specified,
                       the default hard-coded values will be used.

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/stm32mp1-clks.h>
    rng@54003000 {
      compatible = "st,stm32-rng";
      reg = <0x54003000 0x400>;
      clocks = <&rcc RNG1_K>;
    };

...
